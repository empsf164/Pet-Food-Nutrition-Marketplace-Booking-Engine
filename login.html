<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — NOURIPET Account</title>
  <meta name="description" content="Sign in to your NOURIPET account to manage pet nutrition consultation appointments and dietary records.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Simple Header -->
  <header class="py-3 border-bottom bg-white" style="background-color: var(--card-bg) !important;">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="navbar-brand">
        <span class="brand-leaf-icon"><i class="bi bi-heart-pulse-fill"></i></span>
        <span>NOURIPET</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle theme">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <a href="signup.html" class="btn btn-np-secondary btn-np-sm">Create Account</a>
      </div>
    </div>
  </header>

  <!-- Login Main Content -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 bg-subtle" style="background-color: var(--bg-subtle);">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5 col-xl-4">
          
          <div class="np-card p-4 p-md-5">
            <div class="text-center mb-4">
              <h1 class="fs-3 fw-bold font-serif mb-1">Welcome Back</h1>
              <p class="small text-muted mb-0">Sign in to access your consultations & pet profiles</p>
            </div>

            <!-- Demo Social Login Buttons -->
            <div class="d-flex flex-column gap-2 mb-4">
              <button type="button" class="btn btn-outline-secondary btn-sm d-flex align-items-center justify-content-center gap-2 py-2">
                <i class="bi bi-google"></i> Continue with Google
              </button>
              <button type="button" class="btn btn-outline-secondary btn-sm d-flex align-items-center justify-content-center gap-2 py-2">
                <i class="bi bi-apple"></i> Continue with Apple
              </button>
            </div>

            <div class="d-flex align-items-center my-3 text-muted small">
              <hr class="flex-grow-1">
              <span class="px-2">or with email</span>
              <hr class="flex-grow-1">
            </div>

            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label small fw-bold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="loginEmail" class="form-control" placeholder="sarah@example.com" value="sarah.jenkins@example.com" required>
                </div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between">
                  <label for="loginPassword" class="form-label small fw-bold">Password</label>
                  <a href="forgot-password.html" class="small text-forest">Forgot password?</a>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-transparent"><i class="bi bi-lock"></i></span>
                  <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="password123" required>
                </div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label small text-muted" for="rememberMe">
                  Remember my session for 30 days
                </label>
              </div>

              <button type="submit" class="btn btn-np-primary w-100 py-2 mb-3" id="loginSubmitBtn">
                Sign In &rarr;
              </button>
            </form>

            <div class="text-center text-muted small">
              Don't have an account? <a href="signup.html" class="fw-bold text-forest">Sign Up</a>
            </div>

            <div class="text-center mt-3">
              <span class="text-muted" style="font-size: 0.72rem;">*Front-end demo authentication. Any credentials proceed.</span>
            </div>

          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Mini Footer -->
  <footer class="py-3 border-top text-center text-muted small bg-white" style="background-color: var(--card-bg) !important;">
    © 2026 NOURIPET Inc. All rights reserved. <a href="index.html" class="text-muted ms-2">Back to Home</a>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    document.getElementById('loginForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Signing in...`;
      setTimeout(() => {
        window.location.href = 'marketplace.html';
      }, 700);
    });
  </script>

</body>
</html>
