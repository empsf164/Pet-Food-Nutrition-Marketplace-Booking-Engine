<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — NOURIPET Account</title>
  <meta name="description" content="Sign in to your NOURIPET account to manage pet nutrition consultation appointments and dietary records.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="shortcut icon" href="assets/images/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>
<body class="bg-subtle min-vh-100 d-flex align-items-center justify-content-center py-4 position-relative" style="background-color: var(--bg-subtle);">

  <!-- Top Right Corner Theme Toggle Button -->
  <div class="position-fixed top-0 end-0 p-3 p-md-4" style="z-index: 1050;">
    <button type="button" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <!-- Main Login Card Container -->
  <div class="container my-auto">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5 col-xl-4">

        <div class="np-card p-4 p-md-5">

          <!-- Brandname inside box in top center -->
          <div class="text-center mb-4">
            <a href="index.html" class="navbar-brand d-inline-flex align-items-center justify-content-center gap-2 mb-3 text-decoration-none">
              <span class="brand-leaf-icon"><i class="bi bi-heart-pulse-fill"></i></span>
              <span class="fw-bold font-serif fs-4" style="color: var(--text-primary);">NOURIPET</span>
            </a>
            <h1 class="fs-4 fw-bold font-serif mb-1">Welcome Back</h1>
            <p class="small text-muted mb-0">Sign in to access your consultations & pet profiles</p>
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="loginEmail" class="form-label small fw-bold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent"><i class="bi bi-envelope"></i></span>
                <input type="email" id="loginEmail" class="form-control" placeholder="sarah@example.com" value="sarah.jenkins@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="loginPassword" class="form-label small fw-bold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent"><i class="bi bi-lock"></i></span>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="password123" required>
              </div>
            </div>

            <!-- Same Line: Remember Me & Forgot Password -->
            <div class="d-flex align-items-center justify-content-between mb-4">
              <div class="form-check mb-0">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label small text-muted" for="rememberMe">
                  Remember me
                </label>
              </div>
              <a href="forgot-password.html" class="small text-forest fw-semibold text-decoration-none">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-np-primary w-100 py-2 mb-3" id="loginSubmitBtn">
              Sign In &rarr;
            </button>
          </form>

          <div class="text-center text-muted small mb-3">
            Don't have an account? <a href="signup.html" class="fw-bold text-forest">Sign Up</a>
          </div>

          <!-- Bottom Social Section: Google & Apple Icons -->
          <div class="d-flex align-items-center my-3 text-muted small">
            <hr class="flex-grow-1 border-secondary opacity-25">
            <span class="px-2 text-muted" style="font-size: 0.78rem;">Or continue with</span>
            <hr class="flex-grow-1 border-secondary opacity-25">
          </div>

          <div class="d-flex justify-content-center gap-2">
            <button type="button" class="btn btn-np-secondary btn-sm d-flex align-items-center justify-content-center gap-2 flex-fill py-2" aria-label="Sign in with Google">
              <i class="bi bi-google fs-6 text-danger"></i>
              <span class="fw-semibold small">Google</span>
            </button>
            <button type="button" class="btn btn-np-secondary btn-sm d-flex align-items-center justify-content-center gap-2 flex-fill py-2" aria-label="Sign in with Apple">
              <i class="bi bi-apple fs-6"></i>
              <span class="fw-semibold small">Apple</span>
            </button>
          </div>

          <div class="text-center mt-3">
            <span class="text-muted" style="font-size: 0.72rem;">*Front-end demo authentication.</span>
          </div>

        </div>

        <div class="text-center mt-3">
          <a href="index.html" class="text-muted small text-decoration-none">&larr; Back to Homepage</a>
        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    document.getElementById('loginForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Signing in...`;
      setTimeout(() => {
        window.location.href = 'marketplace.html';
      }, 700);
    });
  </script>

</body>
</html>
