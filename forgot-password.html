<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NOURIPET</title>
  <meta name="description" content="Reset your NOURIPET account password to regain access to your pet dietary consults and records.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Header -->
  <header class="py-3 border-bottom bg-white" style="background-color: var(--card-bg) !important;">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="navbar-brand">
        <span class="brand-leaf-icon"><i class="bi bi-heart-pulse-fill"></i></span>
        <span>NOURIPET</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle theme">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <a href="login.html" class="btn btn-np-secondary btn-np-sm">Back to Sign In</a>
      </div>
    </div>
  </header>

  <!-- Forgot Password Main Content -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 bg-subtle" style="background-color: var(--bg-subtle);">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5 col-xl-4">
          
          <div class="np-card p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="brand-leaf-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.35rem;">
                <i class="bi bi-key-fill"></i>
              </div>
              <h1 class="fs-3 fw-bold font-serif mb-1">Reset Password</h1>
              <p class="small text-muted mb-0">Enter your email and we'll send a secure password recovery link.</p>
            </div>

            <form id="forgotForm">
              <div class="mb-3">
                <label for="recoveryEmail" class="form-label small fw-bold">Account Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="recoveryEmail" class="form-control" placeholder="sarah@example.com" value="sarah.jenkins@example.com" required>
                </div>
              </div>

              <div id="forgotAlert" class="alert alert-success small d-none mb-3">
                <i class="bi bi-check-circle-fill me-1"></i> A demo password reset link has been dispatched to your email!
              </div>

              <button type="submit" class="btn btn-np-primary w-100 py-2 mb-3" id="forgotSubmitBtn">
                Send Recovery Link &rarr;
              </button>
            </form>

            <div class="text-center text-muted small">
              Remember your password? <a href="login.html" class="fw-bold text-forest">Sign In</a>
            </div>

            <div class="text-center mt-3">
              <span class="text-muted" style="font-size: 0.72rem;">*Front-end demo state.</span>
            </div>

          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Mini Footer -->
  <footer class="py-3 border-top text-center text-muted small bg-white" style="background-color: var(--card-bg) !important;">
    © 2026 NOURIPET Inc. All rights reserved. <a href="index.html" class="text-muted ms-2">Back to Home</a>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    document.getElementById('forgotForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('forgotSubmitBtn');
      const alertBox = document.getElementById('forgotAlert');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Dispatching link...`;

      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = `Send Recovery Link &rarr;`;
        alertBox.classList.remove('d-none');
      }, 700);
    });
  </script>

</body>
</html>
