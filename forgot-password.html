<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NOURIPET</title>
  <meta name="description" content="Reset your NOURIPET account password to regain access to your pet dietary consults and records.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="shortcut icon" href="assets/images/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>
<body class="bg-subtle min-vh-100 d-flex align-items-center justify-content-center py-4 position-relative" style="background-color: var(--bg-subtle);">

  <!-- Top Right Corner Theme Toggle Button -->
  <div class="position-fixed top-0 end-0 p-3 p-md-4" style="z-index: 1050;">
    <button type="button" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
  </div>

  <!-- Main Reset Password Card Container -->
  <div class="container my-auto">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5 col-xl-4">

        <div class="np-card p-4 p-md-5">

          <!-- Brandname inside box in top center -->
          <div class="text-center mb-4">
            <a href="index.html" class="navbar-brand d-inline-flex align-items-center justify-content-center gap-2 mb-3 text-decoration-none">
              <span class="brand-leaf-icon"><i class="bi bi-heart-pulse-fill"></i></span>
              <span class="fw-bold font-serif fs-4" style="color: var(--text-primary);">NOURIPET</span>
            </a>
            <div class="brand-leaf-icon mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.25rem;">
              <i class="bi bi-key-fill"></i>
            </div>
            <h1 class="fs-4 fw-bold font-serif mb-1">Reset Password</h1>
            <p class="small text-muted mb-0">Enter your email and we'll send a secure password recovery link.</p>
          </div>

          <form id="forgotForm">
            <div class="mb-3">
              <label for="recoveryEmail" class="form-label small fw-bold">Account Email</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent"><i class="bi bi-envelope"></i></span>
                <input type="email" id="recoveryEmail" class="form-control" placeholder="sarah@example.com" value="sarah.jenkins@example.com" required>
              </div>
            </div>

            <div id="forgotAlert" class="alert alert-success small d-none mb-3">
              <i class="bi bi-check-circle-fill me-1"></i> A demo password reset link has been dispatched to your email!
            </div>

            <button type="submit" class="btn btn-np-primary w-100 py-2 mb-3" id="forgotSubmitBtn">
              Send Recovery Link &rarr;
            </button>
          </form>

          <div class="text-center text-muted small mb-3">
            Remember your password? <a href="login.html" class="fw-bold text-forest">Sign In</a>
          </div>

          <!-- Bottom Social Section: Google & Apple Icons -->
          <div class="d-flex align-items-center my-3 text-muted small">
            <hr class="flex-grow-1 border-secondary opacity-25">
            <span class="px-2 text-muted" style="font-size: 0.78rem;">Or sign in with</span>
            <hr class="flex-grow-1 border-secondary opacity-25">
          </div>

          <div class="d-flex justify-content-center gap-2">
            <button type="button" class="btn btn-np-secondary btn-sm d-flex align-items-center justify-content-center gap-2 flex-fill py-2" aria-label="Sign in with Google">
              <i class="bi bi-google fs-6 text-danger"></i>
              <span class="fw-semibold small">Google</span>
            </button>
            <button type="button" class="btn btn-np-secondary btn-sm d-flex align-items-center justify-content-center gap-2 flex-fill py-2" aria-label="Sign in with Apple">
              <i class="bi bi-apple fs-6"></i>
              <span class="fw-semibold small">Apple</span>
            </button>
          </div>

          <div class="text-center mt-3">
            <span class="text-muted" style="font-size: 0.72rem;">*Front-end demo recovery.</span>
          </div>

        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    document.getElementById('forgotForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('forgotSubmitBtn');
      const alertBox = document.getElementById('forgotAlert');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Dispatching link...`;

      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = `Send Recovery Link &rarr;`;
        alertBox.classList.remove('d-none');
      }, 700);
    });
  </script>

</body>
</html>
