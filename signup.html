<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account — Pet Owner or Specialist | NOURIPET</title>
  <meta name="description" content="Sign up for NOURIPET as a pet parent or apply to become a verified nutrition host.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Header -->
  <header class="py-3 border-bottom bg-white" style="background-color: var(--card-bg) !important;">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="navbar-brand">
        <span class="brand-leaf-icon"><i class="bi bi-heart-pulse-fill"></i></span>
        <span>NOURIPET</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <button type="button" class="theme-toggle-btn" aria-label="Toggle theme">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <span class="small text-muted d-none d-sm-inline">Already registered?</span>
        <a href="login.html" class="btn btn-np-secondary btn-np-sm">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Signup Main -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 bg-subtle" style="background-color: var(--bg-subtle);">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
          
          <div class="np-card p-4 p-md-5">
            <div class="text-center mb-4">
              <h1 class="fs-3 fw-bold font-serif mb-1">Create Your Account</h1>
              <p class="small text-muted mb-0">Join the evidence-based pet nutrition platform</p>
            </div>

            <!-- Role Selector Toggle -->
            <label class="form-label small fw-bold mb-2">I am registering as:</label>
            <div class="d-flex gap-2 mb-4">
              <button type="button" class="btn btn-np-primary flex-fill btn-sm role-toggle-btn active" data-role="parent" id="roleParentBtn">
                <i class="bi bi-person-heart me-1"></i> Pet Owner
              </button>
              <button type="button" class="btn btn-outline-secondary flex-fill btn-sm role-toggle-btn" data-role="host" id="roleHostBtn">
                <i class="bi bi-patch-check me-1"></i> Specialist / Host
              </button>
            </div>

            <form id="signupForm">
              
              <!-- Common Fields -->
              <div class="row g-3 mb-3">
                <div class="col-12">
                  <label for="signupName" class="form-label small fw-bold">Full Name <span class="text-danger">*</span></label>
                  <input type="text" id="signupName" class="form-control" placeholder="e.g. Sarah Jenkins" required>
                </div>
                
                <div class="col-12">
                  <label for="signupEmail" class="form-label small fw-bold">Email Address <span class="text-danger">*</span></label>
                  <input type="email" id="signupEmail" class="form-control" placeholder="sarah@example.com" required>
                </div>

                <!-- Pet Parent Specific Fields -->
                <div class="col-12 role-field-parent">
                  <label for="signupPetType" class="form-label small fw-bold">Primary Pet Companion</label>
                  <select id="signupPetType" class="form-select">
                    <option value="dog" selected>Dog (Canine)</option>
                    <option value="cat">Cat (Feline)</option>
                    <option value="both">Both Dog & Cat</option>
                    <option value="puppy">Puppy (< 1 yr)</option>
                    <option value="kitten">Kitten (< 1 yr)</option>
                    <option value="other">Other Companion</option>
                  </select>
                </div>

                <!-- Host Specific Fields (Hidden by default) -->
                <div class="col-12 role-field-host d-none">
                  <label for="signupSpecialty" class="form-label small fw-bold">Clinical Specialty <span class="text-danger">*</span></label>
                  <select id="signupSpecialty" class="form-select">
                    <option value="canine">Canine Clinical Dietetics</option>
                    <option value="feline">Feline Renal & Gut Health</option>
                    <option value="raw">Raw & Fresh Diet Formulation</option>
                    <option value="weight">Metabolic & Senior Weight Protocols</option>
                    <option value="early-life">Pediatric Puppy & Kitten Growth</option>
                  </select>
                </div>

                <div class="col-12 role-field-host d-none">
                  <label for="signupServiceArea" class="form-label small fw-bold">Practice Location / City <span class="text-danger">*</span></label>
                  <input type="text" id="signupServiceArea" class="form-control" placeholder="e.g. Portland, OR & Worldwide Virtual">
                </div>

                <div class="col-12">
                  <label for="signupPassword" class="form-label small fw-bold">Create Password <span class="text-danger">*</span></label>
                  <input type="password" id="signupPassword" class="form-control" placeholder="Minimum 8 characters" minlength="8" required>
                </div>
              </div>

              <div class="form-check mb-4 small text-secondary">
                <input class="form-check-input" type="checkbox" id="termsAgree" required>
                <label class="form-check-label" for="termsAgree">
                  I agree to the NOURIPET <a href="about.html" class="text-forest">Terms of Service</a> and <a href="about.html" class="text-forest">Privacy Policy</a>.
                </label>
              </div>

              <button type="submit" class="btn btn-np-primary w-100 py-2 mb-3" id="signupSubmitBtn">
                <span id="signupBtnText">Create Pet Parent Account &rarr;</span>
              </button>
            </form>

            <div class="text-center text-muted small">
              Already have an account? <a href="login.html" class="fw-bold text-forest">Sign In</a>
            </div>

            <div class="text-center mt-3">
              <span class="text-muted" style="font-size: 0.72rem;">*Front-end demo registration. No database write occurs.</span>
            </div>

          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Mini Footer -->
  <footer class="py-3 border-top text-center text-muted small bg-white" style="background-color: var(--card-bg) !important;">
    © 2026 NOURIPET Inc. All rights reserved. <a href="index.html" class="text-muted ms-2">Back to Home</a>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const parentBtn = document.getElementById('roleParentBtn');
      const hostBtn = document.getElementById('roleHostBtn');
      const parentFields = document.querySelectorAll('.role-field-parent');
      const hostFields = document.querySelectorAll('.role-field-host');
      const btnText = document.getElementById('signupBtnText');

      function setRole(role) {
        if (role === 'host') {
          hostBtn.classList.add('btn-np-primary', 'active');
          hostBtn.classList.remove('btn-outline-secondary');
          parentBtn.classList.remove('btn-np-primary', 'active');
          parentBtn.classList.add('btn-outline-secondary');

          parentFields.forEach(f => f.classList.add('d-none'));
          hostFields.forEach(f => f.classList.remove('d-none'));
          btnText.textContent = 'Apply as Verified Nutrition Host →';
        } else {
          parentBtn.classList.add('btn-np-primary', 'active');
          parentBtn.classList.remove('btn-outline-secondary');
          hostBtn.classList.remove('btn-np-primary', 'active');
          hostBtn.classList.add('btn-outline-secondary');

          hostFields.forEach(f => f.classList.add('d-none'));
          parentFields.forEach(f => f.classList.remove('d-none'));
          btnText.textContent = 'Create Pet Parent Account →';
        }
      }

      parentBtn.addEventListener('click', () => setRole('parent'));
      hostBtn.addEventListener('click', () => setRole('host'));

      // Check query param (e.g. signup.html?role=host)
      const params = new URLSearchParams(window.location.search);
      if (params.get('role') === 'host') {
        setRole('host');
      }

      document.getElementById('signupForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('signupSubmitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Setting up profile...`;
        setTimeout(() => {
          window.location.href = 'marketplace.html';
        }, 700);
      });
    });
  </script>

</body>
</html>
